name: Auto Beta

# Builds and ships a beta on every push to main that changes shipping code.
#
# Nothing is tagged and no GitHub release is created. Betas are throwaway builds
# cut several times a week, and a tag per push would bury the handful of real
# release tags in GitWyrm's own ref list. Everything a beta needs -- installers
# and the signed manifest the updater reads -- lives on the CDN, so the repo
# stays clean and cleanup is a single prefix delete.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    # Pushes that cannot change what a user runs do not deserve a full
    # production-target build. Workflow and release-script changes are not
    # ignored: they need to exercise this pipeline before the next release.
    # paths-ignore is a negative filter: a push that
    # touches ANY file outside this list still builds.
    paths-ignore:
      - "docs/**"
      - "openspec/**"
      - "**/*.md"

concurrency:
  # Serialised, not cancelled: two pushes in quick succession must not race to
  # publish beta.json, or the channel could end up pointing at the older build.
  group: auto-beta
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    # Reads tags and release metadata only; the beta channel ships to the CDN,
    # not to a GitHub release.
    permissions:
      contents: read
    # `[skip beta]` anywhere in the commit message is the manual escape hatch.
    if: "!contains(github.event.head_commit.message, '[skip beta]')"
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      # Full history: the numbering reads release tags, and a shallow clone has
      # none of them.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Work out the next beta version
        id: next
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # The floor is the newest stable release tag. Betas are not tagged, so
          # the tag list only ever contains real releases and cannot drift.
          latest_stable=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -n1 || true)

          if [ -z "$latest_stable" ]; then
            base="0.0.1"
          else
            # Patch bump. Shipping 0.7.0 instead of the predicted 0.6.1 is still
            # fine: the next beta after it simply becomes 0.7.1-beta.1.
            IFS=. read -r major minor patch <<<"$latest_stable"
            base="${major}.${minor}.$((patch + 1))"
          fi

          # With no tags to count, the beta number comes from what is already
          # published on the CDN. beta.json names the version it points at, so
          # the current beta is read straight back out of it.
          current=$(curl -fsSL "https://cdn.gitwyrm.com/updates/beta.json" 2>/dev/null \
            | jq -r '.version // empty' || true)

          n=0
          if [[ "$current" == "${base}-beta."* ]]; then
            n="${current##*-beta.}"
            # A malformed suffix must not silently restart numbering at 1 and
            # overwrite a published build.
            if ! [[ "$n" =~ ^[0-9]+$ ]]; then
              echo "::error::Cannot parse beta number from published version '$current'"
              exit 1
            fi
          fi

          version="${base}-beta.$(( n + 1 ))"
          echo "Latest stable: ${latest_stable:-none} | published beta: ${current:-none} | building: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    # Checkout plus reading upstream release assets for the bundled toolset.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            tauri_args: ""
            bundle_base: src-tauri/target/release/bundle
            cdn_suffix: ""
          - arch: aarch64
            os: windows-latest
            rust_target: aarch64-pc-windows-msvc
            tauri_args: "--target aarch64-pc-windows-msvc"
            bundle_base: src-tauri/target/aarch64-pc-windows-msvc/release/bundle
            cdn_suffix: "-ARM64"
          - arch: x86_64-linux
            os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            tauri_args: "--config src-tauri/tauri.linux.conf.json"
            bundle_base: src-tauri/target/release/bundle
            cdn_suffix: ""
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.arch }}

      # The updater compares the manifest version against the version compiled
      # into the running app, so these must match or a beta re-offers itself
      # forever. Mirrors the release workflow's step; there is no tag to read
      # the version from here, so it comes from the version job.
      - name: Sync version
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $version = $env:VERSION
          Write-Host "Setting version to $version"

          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $conf.version = $version
          $conf | ConvertTo-Json -Depth 100 | Set-Content src-tauri/tauri.conf.json

          # Only the first version= line, which is the [package] one.
          $cargo = Get-Content src-tauri/Cargo.toml
          $done = $false
          $cargo = $cargo | ForEach-Object {
            if (-not $done -and $_ -match '^version\s*=') {
              $done = $true
              "version = `"$version`""
            } else {
              $_
            }
          }
          $cargo | Set-Content src-tauri/Cargo.toml

          $lock = Get-Content src-tauri/Cargo.lock -Raw
          $pattern = '(?m)^(name = "gitwyrm"\r?\nversion = )"[^"]*"'
          if ($lock -notmatch $pattern) { throw "gitwyrm package entry not found in Cargo.lock" }
          $lock = [regex]::Replace($lock, $pattern, "`$1`"$version`"")
          Set-Content src-tauri/Cargo.lock -Value $lock -NoNewline

          npm version $version --no-git-tag-version --allow-same-version

      - name: Sync version (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          version="$VERSION"
          tmp=$(mktemp)

          jq --arg v "$version" '.version = $v' src-tauri/tauri.conf.json > "$tmp"
          mv "$tmp" src-tauri/tauri.conf.json

          awk -v v="$version" '
            !done && /^version[[:space:]]*=/ { print "version = \"" v "\""; done=1; next }
            { print }
          ' src-tauri/Cargo.toml > "$tmp"
          mv "$tmp" src-tauri/Cargo.toml

          python3 - "$version" <<'PY'
          import pathlib
          import re
          import sys

          path = pathlib.Path("src-tauri/Cargo.lock")
          text = path.read_text()
          replacement = rf'\g<1>"{sys.argv[1]}"'
          updated, count = re.subn(
              r'(?m)^(name = "gitwyrm"\r?\nversion = )"[^"]*"',
              replacement,
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("gitwyrm package entry not found in Cargo.lock")
          path.write_text(updated)
          PY

          npm version "$version" --no-git-tag-version --allow-same-version

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      # The window that covers the gap between the old app exiting and the new
      # one starting. Betas update far more often than releases, so this is the
      # channel where its absence would be most obvious -- and where it gets
      # tested before a release depends on it.
      - name: Build the update cover helper
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.rust_target }} \
            --manifest-path src-tauri/bootstrapper/Cargo.toml
          mkdir -p src-tauri/resources
          cp "src-tauri/bootstrapper/target/${{ matrix.rust_target }}/release/gitwyrm-setup.exe" \
            src-tauri/resources/gitwyrm-setup.exe

      # Staged OUTSIDE src-tauri/resources, matching release.yml: anything under
      # resources/ goes through the NSIS resources loop, which deletes and
      # re-extracts every file on every app update. The tools are published to
      # the CDN below and fetched by the bootstrapper instead.
      - name: Fetch git and gpg
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x .github/scripts/*.sh
          .github/scripts/fetch-bundled-tools.sh ${{ matrix.arch }} toolset-staging

      # Betas and releases share one toolset: it is keyed by the upstream Git for
      # Windows tag, not by the GitWyrm version, so whichever channel ships a new
      # upstream git first publishes it and the other skips. Without this a beta
      # tester on a clean machine would have no git at all -- the manifest the
      # app and bootstrapper both read would be missing or stale.
      - name: Publish the toolset to the CDN
        if: runner.os == 'Windows'
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          pip install --quiet awscli
          .github/scripts/publish-toolset.sh ${{ matrix.arch }} toolset-staging

      # No tagName/releaseName: without them tauri-action builds and signs the
      # bundle but creates no GitHub release, which is the whole point here.
      # TAURI_SIGNING_PRIVATE_KEY still applies, so the .sig files a beta needs
      # are produced exactly as they are for a release.
      - name: Build signed packages
        uses: tauri-apps/tauri-action@v1
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        with:
          args: ${{ matrix.tauri_args }}

      - name: Upload Rust debug symbols to Sentry
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: nyxservices
          SENTRY_PROJECT: gitwyrm-backend
        run: |
          $dir = "src-tauri/target/${{ matrix.rust_target }}/release"
          if (-not (Test-Path "$dir/gitwyrm.exe")) {
            $dir = "src-tauri/target/release"
          }
          npx @sentry/cli debug-files upload --include-sources "$dir"

      - name: Upload Rust debug symbols to Sentry (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: nyxservices
          SENTRY_PROJECT: gitwyrm-backend
        run: npx @sentry/cli debug-files upload --include-sources src-tauri/target/release/gitwyrm

      # Installer plus its detached signature. The signature is what the updater
      # verifies before running anything, so it has to travel with the binary --
      # publish-beta-manifest.sh reads it back out to build beta.json.
      - name: Upload installer to CDN
        if: runner.os == 'Windows'
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          VERSION: ${{ needs.version.outputs.version }}
          SUFFIX: ${{ matrix.cdn_suffix }}
        run: |
          set -euo pipefail
          pip install --quiet awscli

          NSIS_EXE=$(find "${{ matrix.bundle_base }}/nsis" -name "*-setup.exe" -type f | head -1)
          if [ -z "$NSIS_EXE" ]; then
            echo "::error::No NSIS installer found under ${{ matrix.bundle_base }}/nsis"
            exit 1
          fi
          if [ ! -f "${NSIS_EXE}.sig" ]; then
            echo "::error::No signature beside ${NSIS_EXE}; the updater would reject this build."
            exit 1
          fi

          for src in "$NSIS_EXE" "${NSIS_EXE}.sig"; do
            ext="exe"
            [ "$src" = "${NSIS_EXE}.sig" ] && ext="exe.sig"
            aws s3 cp "$src" \
              "s3://gitwyrm-cdn/betas/${VERSION}/GitWyrm-Setup${SUFFIX}.${ext}" \
              --endpoint-url "$R2_ENDPOINT" \
              --cache-control "public, max-age=31536000, immutable"
          done

          echo "Uploaded GitWyrm-Setup${SUFFIX}.exe for ${VERSION}"

      - name: Upload Linux packages to CDN
        if: runner.os == 'Linux'
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          pip install --quiet awscli

          upload_signed() {
            local pattern="$1" dest="$2" src
            src=$(find "${{ matrix.bundle_base }}" -type f -name "$pattern" | head -1)
            if [ -z "$src" ] || [ ! -f "$src" ]; then
              echo "::error::No Linux package matching $pattern"
              exit 1
            fi
            if [ ! -f "${src}.sig" ]; then
              echo "::error::No signature beside $src; the updater would reject this build."
              exit 1
            fi
            for file in "$src" "${src}.sig"; do
              suffix=""
              [ "$file" = "${src}.sig" ] && suffix=".sig"
              aws s3 cp "$file" \
                "s3://gitwyrm-cdn/betas/${VERSION}/${dest}${suffix}" \
                --endpoint-url "$R2_ENDPOINT" \
                --cache-control "public, max-age=31536000, immutable"
            done
          }

          upload_signed '*.AppImage' 'GitWyrm-x86_64.AppImage'
          upload_signed '*.deb' 'GitWyrm-amd64.deb'
          upload_signed '*.rpm' 'GitWyrm-x86_64.rpm'

  # Moves the beta channel pointer only after every production target is signed
  # and uploaded. A partial beta is not published.
  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    # Publishes to R2 with its own credentials; needs nothing from the GitHub
    # token beyond checkout.
    permissions:
      contents: read
    steps:
      # Full history and tags: the changelog range runs from the newest stable
      # tag to HEAD, and a shallow checkout has neither.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Beta testers get the notes for what they are installing, which they
      # previously had no way to see -- only stable releases uploaded a
      # changelog. These entries are deleted again by the next stable release,
      # whose own entry covers the same commits.
      #
      # Runs before the manifest below so the notes are in place by the time the
      # channel starts offering the build. A failure here must not block the
      # beta itself, hence continue-on-error: a beta with no notes is worse than
      # nothing published, but far better than no beta.
      - name: Publish beta changelog to gitwyrm.com
        continue-on-error: true
        env:
          CHANGELOG_API_KEY: ${{ secrets.CHANGELOG_API_KEY }}
          CHANGELOG_API_URL: https://gitwyrm.com/api/v1/changelogs
          PRODUCT: GitWyrm
          BETA_VERSION: ${{ needs.version.outputs.version }}
          DOWNLOAD_URL: https://cdn.gitwyrm.com/betas/${{ needs.version.outputs.version }}/GitWyrm-Setup.exe
        run: |
          chmod +x .github/scripts/*.sh
          .github/scripts/upload-changelog.sh

      - name: Publish beta channel manifest
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          pip install --quiet awscli
          chmod +x .github/scripts/*.sh
          .github/scripts/publish-beta-manifest.sh "$VERSION"

      - name: Summary
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          {
            echo "### Beta ${VERSION} published"
            echo
            echo "Testers on the Beta channel get it at their next update check."
            echo
            echo "Fresh install: <https://cdn.gitwyrm.com/betas/GitWyrm-Setup-Beta.exe>"
            echo
            echo "Linux: <https://cdn.gitwyrm.com/betas/GitWyrm-x86_64.AppImage>"
          } >> "$GITHUB_STEP_SUMMARY"
