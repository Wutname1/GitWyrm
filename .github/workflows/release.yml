name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"

jobs:
  # Runs before any build work so a bad tag fails in seconds rather than after
  # two full matrix builds, and never publishes a release that the updater would
  # then refuse to offer.
  check-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Reject a tag that is not ahead of the latest release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          # Compare on the base version: 0.0.3-beta.1 must still beat a released
          # 0.0.2, and a later 0.0.3 stays legal after its own beta.
          base="${tag%%-beta.*}"

          # Drafts are excluded: a draft tag has not shipped and may be re-cut.
          published=$(gh release list --limit 100 --json tagName,isDraft \
            --jq '.[] | select(.isDraft | not) | .tagName')

          # Base versions of everything published, betas included, for the
          # "is this tag behind?" comparison.
          latest=$(printf '%s\n' "$published" | sed 's/-beta\..*$//' \
            | grep -v '^$' | sort -V | tail -n1 || true)

          if [ -z "$latest" ]; then
            echo "No published release yet; accepting $tag."
            exit 0
          fi

          echo "Tag: $tag (base $base) | latest published: $latest"

          # Exact-tag match only. Promoting 0.0.3 to stable after shipping
          # 0.0.3-beta.1 is the normal flow and must stay allowed.
          if printf '%s\n' "$published" | grep -qxF "$tag"; then
            echo "::error::$tag is already published. Bump the version."
            exit 1
          fi

          older=$(printf '%s\n%s\n' "$base" "$latest" | sort -V | head -n1)
          if [ "$base" != "$latest" ] && [ "$older" = "$base" ]; then
            echo "::error::$tag is behind the latest published release $latest. Clients on $latest would never be offered this build."
            exit 1
          fi

          echo "OK: $tag is ahead of $latest."

  release:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            tauri_args: ""
            bundle_base: src-tauri/target/release/bundle
            portable_suffix: ""
          - arch: aarch64
            os: windows-latest
            rust_target: aarch64-pc-windows-msvc
            tauri_args: "--target aarch64-pc-windows-msvc"
            bundle_base: src-tauri/target/aarch64-pc-windows-msvc/release/bundle
            portable_suffix: "-arm64"
          # Linux ships the AppImage, deb and rpm. The bundle targets come from
          # a separate config because the Tauri CLI filters --bundles by host:
          # naming deb/rpm/appimage in the shared tauri.conf.json risks the
          # Windows legs above rejecting them.
          - arch: x86_64-linux
            os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            tauri_args: "--config src-tauri/tauri.linux.conf.json"
            bundle_base: src-tauri/target/release/bundle
            portable_suffix: ""
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      # A -beta.N tag ships as a GitHub prerelease. The updater reads
      # /releases/latest, which skips prereleases, so betas never get offered
      # to people on the stable channel.
      - name: Determine channel
        id: channel
        shell: bash
        run: |
          if [[ "${{ github.ref_name }}" == *"-beta."* ]]; then
            echo "is_beta=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_beta=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.arch }}

      # Asset filenames and the in-app version come from these manifests, not
      # from the tag. Without this the release for tag 1.2.3 ships files named
      # after whatever version happens to be committed.
      - name: Sync version to tag
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          Write-Host "Setting version to $version"

          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $conf.version = $version
          $conf | ConvertTo-Json -Depth 100 | Set-Content src-tauri/tauri.conf.json

          # Only the first version= line, which is the [package] one. The
          # dependency versions further down must not be touched.
          $cargo = Get-Content src-tauri/Cargo.toml
          $done = $false
          $cargo = $cargo | ForEach-Object {
            if (-not $done -and $_ -match '^version\s*=') {
              $done = $true
              "version = `"$version`""
            } else {
              $_
            }
          }
          $cargo | Set-Content src-tauri/Cargo.toml

          # Cargo.lock records the package's own version too. Left stale it
          # contradicts Cargo.toml, which fails any --locked/--frozen build.
          # Rewritten in place rather than via `cargo update`, which needs the
          # registry index and so cannot run before dependencies are fetched.
          $lock = Get-Content src-tauri/Cargo.lock -Raw
          $pattern = '(?m)^(name = "gitwyrm"\r?\nversion = )"[^"]*"'
          if ($lock -notmatch $pattern) { throw "gitwyrm package entry not found in Cargo.lock" }
          $lock = [regex]::Replace($lock, $pattern, "`$1`"$version`"")
          Set-Content src-tauri/Cargo.lock -Value $lock -NoNewline

          npm version $version --no-git-tag-version --allow-same-version

      # The same four edits as the pwsh step above, for the Linux runner. Kept
      # as a separate step rather than porting both to bash: the Windows legs
      # are the shipping path today and are not worth re-proving for this.
      - name: Sync version to tag (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ github.ref_name }}"
          echo "Setting version to $version"

          # jq rather than sed: the version key must not be matched inside any
          # other string in the config.
          tmp=$(mktemp)
          jq --arg v "$version" '.version = $v' src-tauri/tauri.conf.json > "$tmp"
          mv "$tmp" src-tauri/tauri.conf.json

          # Only the first version= line, which is the [package] one. The
          # dependency versions further down must not be touched.
          awk -v v="$version" '
            !done && /^version[[:space:]]*=/ { print "version = \"" v "\""; done=1; next }
            { print }
          ' src-tauri/Cargo.toml > "$tmp"
          mv "$tmp" src-tauri/Cargo.toml

          # Cargo.lock records the package's own version too. Left stale it
          # contradicts Cargo.toml, which fails any --locked/--frozen build.
          python3 - "$version" <<'PY'
          import pathlib
          import re
          import sys

          path = pathlib.Path("src-tauri/Cargo.lock")
          text = path.read_text()
          replacement = rf'\g<1>"{sys.argv[1]}"'
          updated, count = re.subn(
              r'(?m)^(name = "gitwyrm"\r?\nversion = )"[^"]*"',
              replacement,
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("gitwyrm package entry not found in Cargo.lock")
          path.write_text(updated)
          PY

          npm version "$version" --no-git-tag-version --allow-same-version

      - name: Install frontend dependencies
        run: npm ci

      # xdg-utils is not a build dependency but the AppImage bundler shells out
      # to xdg-open while packing, and fails the bundle outright without it.
      # Absent from a minimal Ubuntu image, so it has to be named explicitly.
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      # The same binary the website's download button serves, bundled into the
      # app as well. Run with --updating it draws the "Updating GitWyrm" window
      # that covers the gap between the old app exiting and the new one starting
      # -- NSIS installs quietly, so without it that gap is a blank screen.
      #
      # Built from source here rather than downloaded from the CDN: an update is
      # exactly when the network is least trustworthy, and a helper fetched at
      # update time would add a download that can fail to the very moment it is
      # meant to be covering. See spawn_update_cover in commands/updates.rs.
      # Windows only: the helper is raw Win32, and the gap it covers is an NSIS
      # quiet install. An AppImage rewrites itself in place, and a deb install
      # shows its own pkexec dialog, so neither has a blank screen to cover.
      - name: Build the update cover helper
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.rust_target }} \
            --manifest-path src-tauri/bootstrapper/Cargo.toml
          mkdir -p src-tauri/resources
          cp "src-tauri/bootstrapper/target/${{ matrix.rust_target }}/release/gitwyrm-setup.exe" \
            src-tauri/resources/gitwyrm-setup.exe

      # GitWyrm ships its own git and gpg so a clean Windows machine can clone,
      # commit, sign, and push with nothing else installed. Fetched fresh on
      # every release rather than committed, so each build picks up the current
      # upstream version. At runtime a system install still wins; see
      # src-tauri/src/git/bundled.rs.
      #
      # Staged OUTSIDE src-tauri/resources on purpose. Anything under resources/
      # goes through the NSIS resources loop, which deletes and re-extracts every
      # file on every app update - 408 files, 103 MB, for tools that change about
      # once a month. They are published to the CDN below and fetched by the
      # installer instead.
      # Windows only: this is Git for Windows. Linux declares git and gpg as
      # package dependencies instead, so nothing is bundled or published there.
      - name: Fetch git and gpg
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x .github/scripts/*.sh
          .github/scripts/fetch-bundled-tools.sh ${{ matrix.arch }} toolset-staging

      # Proves the toolset can actually sign a commit. fetch-bundled-tools.sh
      # copies only the MSYS libraries GnuPG needs rather than all 73 in usr/bin;
      # this is what catches an incomplete list, before it reaches a user.
      # Skipped when cross-compiling, where the fetched binaries cannot run.
      - name: Verify the toolset can sign a commit
        if: runner.os == 'Windows' && matrix.arch == 'x86_64'
        shell: pwsh
        run: .github/scripts/smoke-test-bundled-tools.ps1 toolset-staging

      # Checks the toolset's shape (agent, pinentry, credential manager present)
      # rather than just that git.exe starts. Cheap, and catches an upstream
      # layout change that would otherwise ship broken.
      - name: Check the toolset contents
        if: runner.os == 'Windows' && matrix.arch == 'x86_64'
        env:
          GITWYRM_TOOLSET_DIR: toolset-staging
        run: cargo test --manifest-path src-tauri/Cargo.toml --test bundled_tools -- --ignored

      # Publishes the toolset only when its upstream version differs from what
      # the CDN already serves, so a GitWyrm release whose tools did not move
      # costs nothing and leaves the hash clients cached alone. A new Git for
      # Windows release is therefore picked up by the next GitWyrm release.
      - name: Publish the toolset to the CDN
        if: runner.os == 'Windows'
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          pip install awscli
          .github/scripts/publish-toolset.sh ${{ matrix.arch }} toolset-staging

      - name: Build and release (NSIS + updater manifest)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Lets the Sentry vite plugin upload JS source maps during the frontend
          # build (gitwyrm-frontend project). Absent token = upload silently skipped.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "GitWyrm ${{ github.ref_name }}"
          # Placeholder only. The publish job overwrites this body with the
          # generated changelog before the release goes public, so whatever a
          # matrix leg writes here is never what users end up reading.
          releaseBody: "Release notes are generated when this release is published."
          # Stays a draft here on purpose: every matrix leg shares one release,
          # and publishing from a leg would make it public before the other
          # platforms' packages are attached. The publish job below flips it
          # only after every leg succeeds.
          releaseDraft: true
          prerelease: ${{ steps.channel.outputs.is_beta }}
          args: ${{ matrix.tauri_args }}

      # Upload the backend debug symbols to Sentry (gitwyrm-backend project) so
      # Rust panics get readable stack traces. During alpha we ship the binary
      # unstripped (Cargo `strip = false`) so every build -- installer, portable,
      # and CDN copy -- symbolicates consistently. Revisit stripping for size at
      # beta, when it'd have to happen before the NSIS bundle is signed.
      - name: Upload Rust debug symbols to Sentry
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: nyxservices
          SENTRY_PROJECT: gitwyrm-backend
        run: |
          # Point at the release dir so the upload grabs both the exe and its
          # .pdb -- the PDB is what gives line numbers, not just function names.
          # The x86_64 leg builds with no --target flag, so it lands in the plain
          # target/release; the aarch64 leg uses a target-specific dir. Match how
          # the portable-exe step below picks its path.
          $dir = "src-tauri/target/${{ matrix.rust_target }}/release"
          if (-not (Test-Path "$dir/gitwyrm.exe")) {
            $dir = "src-tauri/target/release"
          }
          npx @sentry/cli debug-files upload --include-sources "$dir"

      - name: Attach portable exe
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Copy-Item src-tauri/target/${{ matrix.rust_target }}/release/gitwyrm.exe gitwyrm-portable${{ matrix.portable_suffix }}.exe -ErrorAction SilentlyContinue
          if (-not (Test-Path gitwyrm-portable${{ matrix.portable_suffix }}.exe)) {
            Copy-Item src-tauri/target/release/gitwyrm.exe gitwyrm-portable${{ matrix.portable_suffix }}.exe
          }
          gh release upload ${{ github.ref_name }} gitwyrm-portable${{ matrix.portable_suffix }}.exe --clobber

      # Same purpose as the pwsh step above: readable Rust stack traces. The
      # symbols are DWARF inside the unstripped ELF rather than a separate PDB
      # (Cargo sets strip = false), so the binary itself is what gets uploaded.
      - name: Upload Rust debug symbols to Sentry (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: nyxservices
          SENTRY_PROJECT: gitwyrm-backend
        run: npx @sentry/cli debug-files upload --include-sources src-tauri/target/release/gitwyrm

      # Version-pinned copies of the Linux artifacts, matching what the Windows
      # step above does for the NSIS installer. The AppImage is the one the
      # updater serves, so it must be fetchable at a stable per-version path.
      - name: Upload versioned Linux packages to CDN
        if: runner.os == 'Linux'
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          set -euo pipefail
          pip install awscli

          upload() {
            local src="$1" dest="$2"
            if [ ! -f "$src" ]; then
              echo "::error::expected $src to exist"
              exit 1
            fi
            echo "Publishing $src -> $dest"
            aws s3 cp "$src" "s3://gitwyrm-cdn/releases/${{ github.ref_name }}/$dest" \
              --endpoint-url "$R2_ENDPOINT" \
              --cache-control "public, max-age=31536000, immutable"
          }

          base="${{ matrix.bundle_base }}"
          upload "$(find "$base/appimage" -name '*.AppImage' -type f | head -1)" "GitWyrm-x86_64.AppImage"
          upload "$(find "$base/deb" -name '*.deb' -type f | head -1)" "GitWyrm-amd64.deb"
          upload "$(find "$base/rpm" -name '*.rpm' -type f | head -1)" "GitWyrm-x86_64.rpm"

      # Only the version-pinned copy is written here. The "latest" path a user
      # actually downloads from is published by the promote-cdn-latest job, which
      # waits for every platform: these legs run independently with fail-fast disabled,
      # so a leg that succeeds while another fails would otherwise leave the two
      # architectures on different versions.
      - name: Upload versioned installer to CDN
        if: runner.os == 'Windows'
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          set -euo pipefail
          pip install awscli
          NSIS_EXE=$(find "${{ matrix.bundle_base }}/nsis" -name "*.exe" -type f | head -1)
          if [ -z "$NSIS_EXE" ]; then
            echo "::error::No NSIS installer found under ${{ matrix.bundle_base }}/nsis"
            exit 1
          fi
          echo "Publishing $NSIS_EXE"
          SUFFIX=""
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            SUFFIX="-ARM64"
          fi
          # Immutable per-version copy. Safe to write per-leg: it is scoped to this
          # tag, so a half-finished release leaves an unreferenced directory rather
          # than a mismatched download. Also the source promote-cdn-latest copies
          # from, so a specific build stays fetchable after latest moves on.
          aws s3 cp "$NSIS_EXE" \
            "s3://gitwyrm-cdn/releases/${{ github.ref_name }}/GitWyrm-Setup${SUFFIX}.exe" \
            --endpoint-url "$R2_ENDPOINT" \
            --cache-control "public, max-age=31536000, immutable"

  # Moves the CDN "latest installer" pointers, which is what the bootstrapper and
  # the website download button resolve to. Gated on the whole build matrix: with
  # fail-fast disabled a passing leg would otherwise promote its arch while the
  # other failed, leaving x64 and ARM64 users on different versions. Promotes by
  # copying the immutable per-version objects each leg already uploaded, so the
  # bytes served are provably the ones from this tag's build.
  #
  # Linux is a production target. A failed matrix leg blocks every latest
  # pointer so no platform can move to a version the others did not ship.
  promote-cdn-latest:
    needs: release
    runs-on: ubuntu-latest
    # Pure R2 work under its own credentials, and no checkout, so the GitHub
    # token needs nothing at all.
    permissions: {}
    steps:
      - name: Determine channel
        id: channel
        shell: bash
        run: |
          if [[ "${{ github.ref_name }}" == *"-beta."* ]]; then
            echo "is_beta=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_beta=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Promote this build to the CDN latest path
        # Betas must never land on the latest path, or everyone downloading
        # GitWyrm-Setup.exe gets a prerelease.
        if: steps.channel.outputs.is_beta == 'false'
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          pip install awscli

          SRC="s3://gitwyrm-cdn/releases/${TAG}"

          # Every production artifact must exist before any pointer moves.
          for suffix in "" "-ARM64"; do
            if ! aws s3 ls "${SRC}/GitWyrm-Setup${suffix}.exe" \
                 --endpoint-url "$R2_ENDPOINT" >/dev/null 2>&1; then
              echo "::error::Missing ${SRC}/GitWyrm-Setup${suffix}.exe - refusing to move the latest pointers."
              exit 1
            fi
          done

          for file in GitWyrm-x86_64.AppImage GitWyrm-amd64.deb GitWyrm-x86_64.rpm; do
            if ! aws s3 ls "${SRC}/${file}" --endpoint-url "$R2_ENDPOINT" >/dev/null 2>&1; then
              echo "::error::Missing ${SRC}/${file} - refusing to move the latest pointers."
              exit 1
            fi
          done

          # Server-side copy: no re-upload, and the promoted bytes are exactly the
          # ones the build produced rather than a second transfer that could differ.
          for suffix in "" "-ARM64"; do
            aws s3 cp "${SRC}/GitWyrm-Setup${suffix}.exe" \
              "s3://gitwyrm-cdn/installers/latest/GitWyrm-Setup${suffix}.exe" \
              --endpoint-url "$R2_ENDPOINT" \
              --cache-control "no-cache, no-store"
            echo "Promoted GitWyrm-Setup${suffix}.exe from ${TAG}"
          done

          for file in GitWyrm-x86_64.AppImage GitWyrm-amd64.deb GitWyrm-x86_64.rpm; do
            aws s3 cp "${SRC}/${file}" \
              "s3://gitwyrm-cdn/installers/latest/${file}" \
              --endpoint-url "$R2_ENDPOINT" \
              --cache-control "no-cache, no-store"
            echo "Promoted ${file} from ${TAG}"
          done

  # Publish the stable deb as a real signed APT archive. The package itself is
  # immutable and versioned; metadata moves only after every referenced object
  # and by-hash index exists, with InRelease uploaded last as the commit point.
  publish-apt:
    needs: release
    runs-on: ubuntu-latest
    permissions: {}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      APT_SIGNING_KEY_B64: ${{ secrets.APT_SIGNING_KEY_B64 }}
      APT_SIGNING_KEY_PASSPHRASE: ${{ secrets.APT_SIGNING_KEY_PASSPHRASE }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Build and sign APT repository
        if: ${{ !contains(github.ref_name, '-beta.') }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y apt-utils gnupg
          pip install awscli

          if [ -z "${APT_SIGNING_KEY_B64:-}" ]; then
            echo "::error::APT_SIGNING_KEY_B64 is required to publish the APT repository"
            exit 1
          fi

          mkdir -p repo/pool/main/g/gitwyrm
          mkdir -p repo/dists/stable/main/binary-amd64
          mkdir -p "$HOME/.gnupg"
          chmod 700 "$HOME/.gnupg"

          deb="repo/pool/main/g/gitwyrm/gitwyrm_${TAG}_amd64.deb"
          aws s3 cp \
            "s3://gitwyrm-cdn/releases/${TAG}/GitWyrm-amd64.deb" \
            "$deb" \
            --endpoint-url "$R2_ENDPOINT"

          package=$(dpkg-deb --field "$deb" Package)
          architecture=$(dpkg-deb --field "$deb" Architecture)
          if [ "$package" != "gitwyrm" ] || [ "$architecture" != "amd64" ]; then
            echo "::error::Expected package gitwyrm/amd64, got ${package}/${architecture}"
            exit 1
          fi

          printf '%s' "$APT_SIGNING_KEY_B64" | base64 --decode > apt-private-key.gpg
          gpg --batch --import apt-private-key.gpg
          fingerprint=$(gpg --batch --with-colons --list-secret-keys \
            | awk -F: '$1 == "fpr" { print $10; exit }')
          if [ -z "$fingerprint" ]; then
            echo "::error::The APT signing secret did not contain a private key"
            exit 1
          fi
          gpg --batch --export "$fingerprint" > repo/gitwyrm-archive-keyring.gpg

          (cd repo && apt-ftparchive packages pool) \
            > repo/dists/stable/main/binary-amd64/Packages
          gzip -9n -c repo/dists/stable/main/binary-amd64/Packages \
            > repo/dists/stable/main/binary-amd64/Packages.gz

          cat > apt-release.conf <<'EOF'
          APT::FTPArchive::Release {
            Origin "GitWyrm";
            Label "GitWyrm";
            Suite "stable";
            Codename "stable";
            Architectures "amd64";
            Components "main";
            Description "GitWyrm stable Linux packages";
            Acquire-By-Hash "yes";
          };
          EOF
          (cd repo && apt-ftparchive -c ../apt-release.conf release dists/stable) \
            > repo/dists/stable/Release

          passphrase_file=$(mktemp)
          trap 'rm -f "$passphrase_file" apt-private-key.gpg' EXIT
          chmod 600 "$passphrase_file"
          printf '%s' "${APT_SIGNING_KEY_PASSPHRASE:-}" > "$passphrase_file"
          sign=(--batch --yes --pinentry-mode loopback --passphrase-file "$passphrase_file" \
            --local-user "$fingerprint")
          gpg "${sign[@]}" --armor --detach-sign \
            --output repo/dists/stable/Release.gpg repo/dists/stable/Release
          gpg "${sign[@]}" --clearsign \
            --output repo/dists/stable/InRelease repo/dists/stable/Release

          index_dir="repo/dists/stable/main/binary-amd64"
          mkdir -p "$index_dir/by-hash/SHA256"
          for index in Packages Packages.gz; do
            hash=$(sha256sum "$index_dir/$index" | cut -d' ' -f1)
            cp "$index_dir/$index" "$index_dir/by-hash/SHA256/$hash"
          done

          apt_prefix="s3://gitwyrm-cdn/apt"
          aws s3 cp "$deb" \
            "$apt_prefix/pool/main/g/gitwyrm/$(basename "$deb")" \
            --endpoint-url "$R2_ENDPOINT" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp repo/gitwyrm-archive-keyring.gpg \
            "$apt_prefix/gitwyrm-archive-keyring.gpg" \
            --endpoint-url "$R2_ENDPOINT" \
            --cache-control "public, max-age=3600"
          aws s3 cp "$index_dir/by-hash" \
            "$apt_prefix/dists/stable/main/binary-amd64/by-hash" \
            --recursive --endpoint-url "$R2_ENDPOINT" \
            --cache-control "public, max-age=31536000, immutable"
          for index in Packages Packages.gz; do
            aws s3 cp "$index_dir/$index" \
              "$apt_prefix/dists/stable/main/binary-amd64/$index" \
              --endpoint-url "$R2_ENDPOINT" --cache-control "no-cache"
          done
          for metadata in Release Release.gpg; do
            aws s3 cp "repo/dists/stable/$metadata" \
              "$apt_prefix/dists/stable/$metadata" \
              --endpoint-url "$R2_ENDPOINT" --cache-control "no-cache"
          done
          # Commit point: clients cannot trust the new indexes until this moves.
          aws s3 cp repo/dists/stable/InRelease \
            "$apt_prefix/dists/stable/InRelease" \
            --endpoint-url "$R2_ENDPOINT" --cache-control "no-cache, no-store"

  # All build legs share one release, so publishing is a separate job that runs
  # only after every platform has finished and attached its assets. The updater
  # endpoint resolves /releases/latest, which ignores drafts - so the release is
  # not live to users, and updates are not offered, until this job runs.
  publish:
    needs: [release, promote-cdn-latest, publish-apt]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Full history + tags: the changelog range is prev-tag..this-tag, which a
      # shallow clone cannot resolve.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          echo "Assets on $TAG:"
          echo "$assets" | sed 's/^/  /'

          # Refuse to publish a half-built release. latest.json is what the
          # in-app updater reads; without it clients silently stop updating.
          missing=0
          for required in latest.json x64-setup.exe arm64-setup.exe .AppImage .deb .rpm; do
            if ! echo "$assets" | grep -q -- "$required"; then
              echo "::error::Missing required asset matching '$required'"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      # tauri-action points the manifest at api.github.com asset URLs, which serve
      # JSON metadata rather than the installer to an unauthenticated client. The
      # updater then feeds that JSON to NSIS, which uninstalls the current version
      # and leaves nothing runnable (shipped as 0.0.3). Rewritten here, before the
      # release goes live, so the manifest is correct the moment anyone can read it.
      # Verification has to wait until after publishing -- a draft's assets 404 on
      # the public download path -- so it runs as its own step further down.
      - name: Point updater manifest at public download URLs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          chmod +x .github/scripts/*.sh
          .github/scripts/resolve-updater-urls.sh rewrite "${{ github.ref_name }}"

      # Publish the structured changelog to gitwyrm.com and render the same
      # items to CHANGELOG.md. Without CHANGELOG_API_KEY the upload is skipped
      # and only the render below runs, so the GitHub Release still gets notes.
      # Stable releases only. The public changelog is a list of things people
      # can actually install; a beta row would be one more entry to scroll past
      # that is deleted again as soon as the release it precedes ships. The
      # release that follows covers the same commits anyway, since its range
      # runs from the previous STABLE tag.
      - name: Publish changelog to gitwyrm.com
        if: "!contains(github.ref_name, '-beta.')"
        env:
          CHANGELOG_API_KEY: ${{ secrets.CHANGELOG_API_KEY }}
          CHANGELOG_API_URL: https://gitwyrm.com/api/v1/changelogs
          PRODUCT: GitWyrm
          RELEASE_VERSION: ${{ github.ref_name }}
          DOWNLOAD_URL: https://cdn.gitwyrm.com/releases/${{ github.ref_name }}/GitWyrm-Setup.exe
        run: |
          chmod +x .github/scripts/*.sh
          .github/scripts/upload-changelog.sh

      # Clear the beta entries this release supersedes. Ordered AFTER the upload
      # so a failed upload never leaves the changelog with no notes at all: the
      # stable entry covers the same commits (its range starts at the previous
      # stable tag), so nothing a beta described is lost.
      - name: Purge superseded beta changelogs
        if: "!contains(github.ref_name, '-beta.')"
        env:
          CHANGELOG_API_KEY: ${{ secrets.CHANGELOG_API_KEY }}
          CHANGELOG_API_URL: https://gitwyrm.com/api/v1/changelogs
          PRODUCT: GitWyrm
        run: |
          chmod +x .github/scripts/*.sh
          .github/scripts/purge-beta-changelogs.sh

      # Build the release body: generated notes on top, download guidance below.
      # render-changelog.sh regenerates from the same commit range, so the body
      # matches what the website received even when the upload was skipped.
      - name: Build release body
        env:
          PRODUCT: GitWyrm
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          chmod +x .github/scripts/*.sh
          .github/scripts/render-changelog.sh CHANGELOG.md >/dev/null

          {
            if [ -s CHANGELOG.md ]; then
              cat CHANGELOG.md
            else
              echo "Maintenance release - no user-facing changes."
              echo
            fi
            cat <<'EOF'
          ---

          ## Download

          **Most people want [GitWyrm-Setup.exe](https://cdn.gitwyrm.com/GitWyrm-Setup.exe)** - it always
          installs the newest version and keeps itself up to date.

          **Linux:** [AppImage](https://cdn.gitwyrm.com/installers/latest/GitWyrm-x86_64.AppImage) ·
          [Ubuntu / Debian / Mint](https://cdn.gitwyrm.com/installers/latest/GitWyrm-amd64.deb) ·
          [Fedora / openSUSE](https://cdn.gitwyrm.com/installers/latest/GitWyrm-x86_64.rpm)

          The installers attached below are pinned to this specific version. `gitwyrm-portable.exe`
          needs no install but does not auto-update.

          Deploying across a company? See the
          [enterprise deployment guide](https://docs.gitwyrm.com/guide/enterprise-deployment).

          See every release on the [changelog](https://gitwyrm.com/changelog).
          EOF
          } > RELEASE_BODY.md

          cat RELEASE_BODY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --notes-file RELEASE_BODY.md --draft=false
          echo "Published $TAG"

      # The public download path only serves a published release, so this is the
      # first moment the manifest's URLs can actually be checked. If any of them
      # does not return a plausible installer the release goes back to draft --
      # better a missing release than one that bricks every client that updates.
      - name: Verify updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          chmod +x .github/scripts/*.sh
          if ! .github/scripts/resolve-updater-urls.sh verify "$TAG"; then
            echo "::error::Reverting $TAG to draft; its updater manifest is unusable."
            gh release edit "$TAG" --draft=true
            exit 1
          fi

      # The channel manifest clients actually poll. Written last, once the
      # release is live and its manifest verified, so no client is ever pointed
      # at a build that might still be pulled back to draft.
      #
      # A beta writes ONLY updates/beta.json; the stable channel is untouched,
      # so a prerelease can never reach someone on stable. A stable release
      # writes both: anyone who opted into betas should move onto the shipped
      # version rather than sit on a superseded prerelease forever.
      - name: Publish CDN channel manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          set -euo pipefail
          pip install --quiet awscli
          chmod +x .github/scripts/*.sh

          .github/scripts/publish-cdn-manifest.sh beta "$TAG"

          if [[ "$TAG" != *"-beta."* ]]; then
            .github/scripts/publish-cdn-manifest.sh stable "$TAG"
          fi


  # Betas are throwaway builds cut on every push to main (see beta.yml). Once a
  # stable release is live they have no audience left -- every beta client is
  # offered this release at its next check -- and their CDN directories are pure
  # storage cost. Purged here rather than on a schedule so cleanup is tied to
  # the event that makes them obsolete.
  #
  # There are no tags or GitHub releases to clean up: betas never had any. This
  # is a prefix delete plus resetting the channel pointer.
  #
  # Runs only after `publish` succeeds. Deleting betas before the stable release
  # is actually live would strand testers with nothing to move to.
  purge-betas:
    needs: publish
    # Stable releases only. A beta must never purge its siblings.
    if: "!contains(github.ref_name, '-beta.')"
    runs-on: ubuntu-latest
    # Deletes superseded betas from R2 under its own credentials, and no
    # checkout. Withholding the GitHub token keeps this job unable to touch
    # releases or refs even if a step is changed later.
    permissions: {}

    steps:
      - name: Purge superseded beta builds
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          TAG: ${{ github.ref_name }}
          BUCKET: gitwyrm-cdn
        run: |
          set -euo pipefail
          pip install --quiet awscli

          # Point the beta channel at this release BEFORE deleting anything. A
          # tester who checks for updates mid-purge then finds the stable build,
          # rather than a manifest naming installers being deleted underneath
          # them.
          #
          # Betas are always a patch ahead of the last stable, so the shipped
          # release is newer than every beta it supersedes and the updater
          # offers it normally -- no downgrade involved.
          aws s3 cp "s3://${BUCKET}/updates/stable.json" \
            "s3://${BUCKET}/updates/beta.json" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type "application/json" \
            --cache-control "no-cache, no-store, must-revalidate"
          echo "Beta channel now points at $TAG"

          # Every versioned beta directory. Betas for a LATER version are kept:
          # if 0.7.0-beta.1 is already out when 0.6.1 ships it is still ahead,
          # and deleting it would strand whoever is testing it.
          versions=$(aws s3 ls "s3://${BUCKET}/betas/" \
            --endpoint-url "$R2_ENDPOINT" \
            | awk '/PRE/ { sub(/\/$/, "", $2); print $2 }' || true)

          if [ -z "$versions" ]; then
            echo "No beta builds to purge."
            exit 0
          fi

          purged=0
          for version in $versions; do
            base="${version%%-beta.*}"

            older=$(printf '%s\n%s\n' "$base" "$TAG" | sort -V | head -n1)
            if [ "$base" != "$TAG" ] && [ "$older" = "$TAG" ]; then
              echo "Keeping $version (targets $base, ahead of $TAG)"
              continue
            fi

            echo "Purging betas/$version"
            aws s3 rm "s3://${BUCKET}/betas/${version}/" \
              --recursive --endpoint-url "$R2_ENDPOINT"
            purged=$(( purged + 1 ))
          done

          # The fixed-name first-install copy points at a build that may have
          # just been deleted, so it has to go too. The next beta republishes
          # it; until then testers install the stable release like everyone else.
          if [ "$purged" -gt 0 ]; then
            for suffix in "" "-ARM64"; do
              aws s3 rm "s3://${BUCKET}/betas/GitWyrm-Setup-Beta${suffix}.exe" \
                --endpoint-url "$R2_ENDPOINT" 2>/dev/null || true
            done
          fi

          echo "Purged $purged beta build(s) superseded by $TAG." \
            >> "$GITHUB_STEP_SUMMARY"
