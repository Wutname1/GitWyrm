name: CI

# Typecheck, test and build every pull request.
#
# This exists because auto-merging Dependabot PRs needs something to gate on:
# without a required check, "merge when green" merges anything that is merely
# not-red, which for an unchecked repo is everything. The auto-merge workflow
# waits on these jobs by name.
#
# CI does not sign or publish. It does build all three Linux package formats so
# every PR has installable artifacts for the desktop test matrix.
on:
  pull_request:
    branches:
      - main
  # Also on main so a direct push that breaks the build is caught rather than
  # waiting for the next PR to surface it.
  push:
    branches:
      - main

concurrency:
  # A new push supersedes the old run: nobody needs the results of the commit
  # that was just replaced.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # `tsc -b` rather than a bare `tsc`: this project builds by project
      # references, and a bare invocation silently checks nothing.
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npx vite build

  rust:
    name: Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ci

      # Tauri needs GTK and friends even to typecheck on Linux. Cheaper than a
      # Windows runner, and a Rust error is almost never platform-specific.
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

  # Proves every Linux package actually packages, not just that Rust compiles.
  # The retained artifact is the quickest path from a PR to the three-VM test
  # matrix: AppImage, deb and rpm all come from the exact commit under review.
  linux-bundle:
    name: Linux bundle
    # Match production's oldest supported build host. Building on a newer glibc
    # can produce packages that will not start on Mint 21 / Ubuntu 22.04.
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ci-linux-bundle

      # xdg-utils is not a build dependency but the AppImage bundler shells out
      # to xdg-open while packing, and fails the bundle outright without it.
      # Absent from a minimal Ubuntu image, so it has to be named explicitly.
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install
        run: npm ci

      # The Linux bundle targets live in a separate config: the Tauri CLI
      # filters --bundles by host, so listing deb/rpm/appimage in the shared
      # tauri.conf.json would make the Windows release leg reject them.
      - name: Build Linux packages
        run: npx tauri build --config src-tauri/tauri.linux.conf.json

      # A missing runtime .so shows up here rather than on a user's machine.
      - name: Check linked libraries
        run: ldd src-tauri/target/release/gitwyrm

      - uses: actions/upload-artifact@v4
        with:
          name: gitwyrm-linux-x86_64
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
          retention-days: 7

  # The update-cover helper is Windows-only (it is raw Win32), so it cannot be
  # checked on the Linux runner above.
  bootstrapper:
    name: Update-cover helper
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri/bootstrapper
          key: ci-bootstrapper

      - name: Test
        run: cargo test --manifest-path src-tauri/bootstrapper/Cargo.toml
