.form-check:not(.form-switch)

  height: 100%;

  height: 14px;

}

.form-check-input[type=&quot;radio&quot;]:checked {

  cursor: not-allowed;

}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,

}

.form-check-label {

.form-switch .form-check-input {

.form-switch .form-check-input::before {

  top: 50%;
  left: 0;

  height: 16px;

  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));

  box-shadow: var(--shadow-sm);

  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);

.form-switch .form-check-input:checked {

.form-switch .form-check-input:checked::before {

}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;

  border-color: var(--ring);

          &lt;button class=&quot;ag-primary-button&quot; type=&quot;button&quot; data-toast=&quot;Issue opened in the main GitWyrm window&quot;&gt;Show in main window&lt;/button&gt;
        &lt;/div&gt;
      &lt;/aside&gt;
    &lt;/div&gt;

    &lt;div class=&quot;ag-toast&quot; role=&quot;status&quot; aria-live=&quot;polite&quot;&gt;&lt;i data-lucide=&quot;circle-check&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span data-toast-text&gt;Done&lt;/span&gt;&lt;/div&gt;
  &lt;/section&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;gitwyrm-agent-graph-mockup&#x27;);
      if (!root) return;
      const sourceDrawer = root.querySelector(&#x27;[data-source-drawer]&#x27;);
      const toast = root.querySelector(&#x27;.ag-toast&#x27;);
      const toastText = root.querySelector(&#x27;[data-toast-text]&#x27;);
      let toastTimer = 0;

      const showToast = (message) =&gt; {
        if (!toast || !toastText) return;
        toastText.textContent = message;
        toast.classList.add(&#x27;is-visible&#x27;);
        window.clearTimeout(toastTimer);
        toastTimer = window.setTimeout(() =&gt; toast.classList.remove(&#x27;is-visible&#x27;), 2300);
      };

      root.querySelectorAll(&#x27;[data-toast]&#x27;).forEach((control) =&gt; {
        control.addEventListener(&#x27;click&#x27;, () =&gt; showToast(control.getAttribute(&#x27;data-toast&#x27;) || &#x27;Done&#x27;));
      });

      root.querySelectorAll(&#x27;.ag-sidebar-filter&#x27;).forEach((button) =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          root.querySelectorAll(&#x27;.ag-sidebar-filter&#x27;).forEach((peer) =&gt; peer.classList.remove(&#x27;is-selected&#x27;));
          button.classList.add(&#x27;is-selected&#x27;);
        });
      });

      const panes = Array.from(root.querySelectorAll(&#x27;[data-pane]&#x27;));
      let activePane = root.querySelector(&#x27;[data-pane].is-active&#x27;) || panes[0] || null;
      let activeDetailKind = &#x27;context&#x27;;

      const paneSide = (pane) =&gt; pane?.getAttribute(&#x27;data-pane&#x27;) === &#x27;secondary&#x27; ? &#x27;right&#x27; : &#x27;left&#x27;;
      const setActivePane = (pane) =&gt; {
        if (!pane) return;
        panes.forEach((peer) =&gt; peer.classList.toggle(&#x27;is-active&#x27;, peer === pane));
        activePane = pane;
        const title = pane.querySelector(&#x27;[data-pane-title]&#x27;)?.textContent || &#x27;active chat&#x27;;
        const source = pane.querySelector(&#x27;[data-pane-source]&#x27;)?.textContent || &#x27;Manual chat&#x27;;
        root.querySelectorAll(&#x27;[data-dock-project]&#x27;).forEach((el) =&gt; { el.textContent = source.split(&#x27;·&#x27;).pop()?.trim() || &#x27;Project&#x27;; });
        root.querySelectorAll(&#x27;[data-dock-source]&#x27;).forEach((el) =&gt; { el.textContent = source.split(&#x27;·&#x27;)[0]?.trim() || source; });
        showToast(`${title} is now the active ${paneSide(pane)} pane`);
      };
      panes.forEach((pane) =&gt; pane.addEventListener(&#x27;pointerdown&#x27;, (event) =&gt; {
        if (event.target.closest(&#x27;button, textarea&#x27;)) return;
        if (activePane !== pane) setActivePane(pane);
      }));

      root.querySelector(&#x27;[data-toggle-split]&#x27;)?.addEventListener(&#x27;click&#x27;, (event) =&gt; {
        const enabled = root.classList.toggle(&#x27;is-split&#x27;);
        const button = event.currentTarget;
        button.classList.toggle(&#x27;is-selected&#x27;, enabled);
        button.setAttribute(&#x27;aria-pressed&#x27;, String(enabled));
        showToast(enabled ? &#x27;Split view opened; chat clicks replace the active pane&#x27; : &#x27;Single view restored; chat clicks replace this chat&#x27;);
      });

      root.querySelector(&#x27;[data-toggle-source]&#x27;)?.addEventListener(&#x27;click&#x27;, (event) =&gt; {
        const hidden = root.classList.toggle(&#x27;is-source-hidden&#x27;);
        const button = event.currentTarget;
        button.classList.toggle(&#x27;is-selected&#x27;, hidden);
        button.setAttribute(&#x27;aria-pressed&#x27;, String(hidden));
        const label = button.querySelector(&#x27;span&#x27;);
        if (label) label.textContent = hidden ? &#x27;Source bars hidden&#x27; : &#x27;Source bars shown&#x27;;
        showToast(hidden ? &#x27;Top source bars hidden; use the link button in each chat&#x27; : &#x27;Top source bars shown&#x27;);
      });

      const closeDetailPopovers = () =&gt; root.querySelectorAll(&#x27;[data-detail-popover]&#x27;).forEach((popover) =&gt; popover.classList.remove(&#x27;is-open&#x27;));
      const detailMarkup = (kind, pane) =&gt; {
        const source = pane.querySelector(&#x27;[data-pane-source]&#x27;)?.textContent || &#x27;Manual chat&#x27;;
        const project = source.split(&#x27;·&#x27;).pop()?.trim() || &#x27;Project&#x27;;
        if (kind === &#x27;source&#x27;) return `&lt;div class=&quot;ag-popover-row&quot;&gt;What started this chat&lt;strong&gt;${source.split(&#x27;·&#x27;)[0]?.trim() || source}&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;ag-popover-row&quot;&gt;Project&lt;strong&gt;${project}&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;ag-popover-row&quot;&gt;Launch snapshot&lt;strong&gt;kept&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;ag-popover-row&quot;&gt;Live source&lt;strong&gt;current&lt;/strong&gt;&lt;/div&gt;`;
        if (kind === &#x27;graph&#x27;) return `&lt;div class=&quot;ag-popover-row&quot;&gt;Lead&lt;strong&gt;Sol · working&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;ag-popover-row&quot;&gt;Helpers&lt;strong&gt;2 working · 1 waiting&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;ag-popover-row&quot;&gt;Integration&lt;strong&gt;queued&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;ag-popover-row&quot;&gt;Worktrees&lt;strong&gt;3 isolated&lt;/strong&gt;&lt;/div&gt;`;
        return `&lt;div style=&quot;display:flex;align-items:center;gap:7px;font-size:10.5px&quot;&gt;&lt;strong&gt;Session context&lt;/strong&gt;&lt;span style=&quot;margin-left:auto;color:var(--ag-muted);font-family:&#x27;Cascadia Mono&#x27;,Consolas,monospace&quot;&gt;17% · 31k / 184k&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ag-popover-meter&quot;&gt;&lt;span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ag-popover-row&quot;&gt;Project&lt;strong&gt;${project}&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;ag-popover-row&quot;&gt;Source&lt;strong&gt;${source.split(&#x27;·&#x27;)[0]?.trim() || source}&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;ag-popover-row&quot;&gt;Usage remaining&lt;strong&gt;2,409 / 15,000&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;ag-popover-row&quot;&gt;Context sources&lt;strong&gt;6&lt;/strong&gt;&lt;/div&gt;`;
      };
      root.querySelectorAll(&#x27;[data-detail-kind]&#x27;).forEach((button) =&gt; {
        button.addEventListener(&#x27;click&#x27;, (event) =&gt; {
          event.stopPropagation();
          const pane = button.closest(&#x27;[data-pane]&#x27;);
          if (!pane) return;
          if (activePane !== pane) setActivePane(pane);
          const kind = button.getAttribute(&#x27;data-detail-kind&#x27;) || &#x27;context&#x27;;
          activeDetailKind = kind;
          const popover = pane.querySelector(&#x27;[data-detail-popover]&#x27;);
          const wasOpen = popover?.classList.contains(&#x27;is-open&#x27;) &amp;&amp; button.classList.contains(&#x27;is-selected&#x27;);
          closeDetailPopovers();
          pane.querySelectorAll(&#x27;[data-detail-kind]&#x27;).forEach((peer) =&gt; peer.classList.toggle(&#x27;is-selected&#x27;, peer === button &amp;&amp; !wasOpen));
          if (!wasOpen &amp;&amp; popover) {
            const title = popover.querySelector(&#x27;[data-popover-title]&#x27;);
            const body = popover.querySelector(&#x27;.ag-popover-body&#x27;);
            if (title) title.textContent = kind === &#x27;source&#x27; ? &#x27;Source&#x27; : kind === &#x27;graph&#x27; ? &#x27;Agent graph&#x27; : &#x27;Context&#x27;;
            if (body) body.innerHTML = detailMarkup(kind, pane);
            popover.classList.add(&#x27;is-open&#x27;);
          }
        });
      });
      root.querySelectorAll(&#x27;[data-detail-popover]&#x27;).forEach((popover) =&gt; popover.addEventListener(&#x27;click&#x27;, (event) =&gt; event.stopPropagation()));
      document.addEventListener(&#x27;click&#x27;, () =&gt; closeDetailPopovers());
      root.querySelectorAll(&#x27;[data-close-detail]&#x27;).forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
        const pane = button.closest(&#x27;[data-pane]&#x27;);
        pane?.querySelector(&#x27;[data-detail-popover]&#x27;)?.classList.remove(&#x27;is-open&#x27;);
        pane?.querySelectorAll(&#x27;[data-detail-kind]&#x27;).forEach((peer) =&gt; peer.classList.remove(&#x27;is-selected&#x27;));
      }));

      const dockPanel = (place) =&gt; {
        root.classList.remove(&#x27;is-panel-left&#x27;, &#x27;is-panel-bottom&#x27;, &#x27;is-panel-right&#x27;);
        closeDetailPopovers();
        if (place === &#x27;left&#x27;) root.classList.add(&#x27;is-panel-left&#x27;);
        if (place === &#x27;bottom&#x27;) root.classList.add(&#x27;is-panel-bottom&#x27;);
        if (place === &#x27;right&#x27;) {
          root.classList.add(&#x27;is-panel-right&#x27;);
          switchPanel(activeDetailKind === &#x27;graph&#x27; ? &#x27;graph&#x27; : &#x27;context&#x27;);
        }
        if (place === &#x27;popover&#x27; &amp;&amp; activePane) {
          const popover = activePane.querySelector(&#x27;[data-detail-popover]&#x27;);
          popover?.classList.add(&#x27;is-open&#x27;);
        }
        showToast(place === &#x27;popover&#x27; ? &#x27;Panel unpinned; it now opens from this chat&#x27; : `Panel pinned to the ${place} and follows the active chat`);
      };
      root.querySelectorAll(&#x27;[data-dock-panel]&#x27;).forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, (event) =&gt; {
        event.stopPropagation();
        dockPanel(button.getAttribute(&#x27;data-dock-panel&#x27;) || &#x27;popover&#x27;);
      }));

      root.querySelectorAll(&#x27;[data-session-title]&#x27;).forEach((thread) =&gt; {
        thread.addEventListener(&#x27;click&#x27;, () =&gt; {
          if (!activePane) return;
          root.querySelectorAll(&#x27;[data-session-title]&#x27;).forEach((peer) =&gt; peer.classList.remove(&#x27;is-selected&#x27;));
          thread.classList.add(&#x27;is-selected&#x27;);
          const title = thread.getAttribute(&#x27;data-session-title&#x27;) || &#x27;New chat&#x27;;
          const source = thread.getAttribute(&#x27;data-session-source&#x27;) || &#x27;Manual chat&#x27;;
          const paneTitle = activePane.querySelector(&#x27;[data-pane-title]&#x27;);
          const paneSource = activePane.querySelector(&#x27;[data-pane-source]&#x27;);
          if (paneTitle) paneTitle.textContent = title;
          if (paneSource) paneSource.textContent = source;
          setActivePane(activePane);
          showToast(`${title} replaced the chat in the active ${paneSide(activePane)} pane`);
        });
      });

      root.querySelector(&#x27;[data-new-chat]&#x27;)?.addEventListener(&#x27;click&#x27;, () =&gt; {
        if (!activePane) return;
        root.querySelectorAll(&#x27;[data-session-title]&#x27;).forEach((peer) =&gt; peer.classList.remove(&#x27;is-selected&#x27;));
        const paneTitle = activePane.querySelector(&#x27;[data-pane-title]&#x27;);
        const paneSource = activePane.querySelector(&#x27;[data-pane-source]&#x27;);
        if (paneTitle) paneTitle.textContent = &#x27;New chat&#x27;;
        if (paneSource) paneSource.textContent = &#x27;Manual chat · current project&#x27;;
        setActivePane(activePane);
        activePane.querySelector(&#x27;textarea&#x27;)?.focus();
        showToast(`New chat replaced the active ${paneSide(activePane)} pane; its draft is kept with this chat`);
      });

      root.querySelectorAll(&#x27;[data-open-source]&#x27;).forEach((control) =&gt; {
        control.addEventListener(&#x27;click&#x27;, () =&gt; sourceDrawer?.classList.add(&#x27;is-open&#x27;));
      });
      root.querySelector(&#x27;[data-close-source]&#x27;)?.addEventListener(&#x27;click&#x27;, () =&gt; sourceDrawer?.classList.remove(&#x27;is-open&#x27;));
      sourceDrawer?.addEventListener(&#x27;click&#x27;, (event) =&gt; {
        if (event.target === sourceDrawer) sourceDrawer.classList.remove(&#x27;is-open&#x27;);
      });

      root.querySelector(&#x27;[data-open-setup]&#x27;)?.addEventListener(&#x27;click&#x27;, () =&gt; {
        root.classList.add(&#x27;is-setup&#x27;);
        root.querySelector(&#x27;[data-open-setup]&#x27;)?.classList.add(&#x27;is-active&#x27;);
        showToast(&#x27;Agent setup opened&#x27;);
      });
      root.querySelector(&#x27;[data-close-setup]&#x27;)?.addEventListener(&#x27;click&#x27;, () =&gt; {
        root.classList.remove(&#x27;is-setup&#x27;);
        root.querySelector(&#x27;[data-open-setup]&#x27;)?.classList.remove(&#x27;is-active&#x27;);
        showToast(&#x27;Returned to the active chat&#x27;);
      });

      const modeNotes = {
        Ask: &#x27;Read and answer only; no helpers or file changes&#x27;,
        Plan: &#x27;Lead may inspect and draft a graph; you start it&#x27;,
        Auto: &#x27;Lead may use up to 3 helpers and asks before risky actions&#x27;
      };
      root.querySelectorAll(&#x27;[data-mode]&#x27;).forEach((button) =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          root.querySelectorAll(&#x27;[data-mode]&#x27;).forEach((peer) =&gt; peer.classList.remove(&#x27;is-selected&#x27;));
          button.classList.add(&#x27;is-selected&#x27;);
          const mode = button.getAttribute(&#x27;data-mode&#x27;) || &#x27;Auto&#x27;;
          const note = root.querySelector(&#x27;[data-mode-note]&#x27;);
          if (note) note.textContent = modeNotes[mode];
          showToast(`${mode} mode selected`);
        });
      });

      const teamPopover = root.querySelector(&#x27;[data-team-popover]&#x27;);
      root.querySelector(&#x27;[data-team-trigger]&#x27;)?.addEventListener(&#x27;click&#x27;, (event) =&gt; {
        event.stopPropagation();
        teamPopover?.classList.toggle(&#x27;is-open&#x27;);
      });
      teamPopover?.addEventListener(&#x27;click&#x27;, (event) =&gt; event.stopPropagation());
      document.addEventListener(&#x27;click&#x27;, () =&gt; teamPopover?.classList.remove(&#x27;is-open&#x27;));

      const switchPanel = (name) =&gt; {
        const panel = root.querySelector(&#x27;.ag-graph-panel&#x27;);
        if (!panel) return;
        panel.classList.toggle(&#x27;is-context&#x27;, name === &#x27;context&#x27;);
        root.querySelectorAll(&#x27;[data-panel-tab]&#x27;).forEach((tab) =&gt; tab.classList.toggle(&#x27;is-selected&#x27;, tab.getAttribute(&#x27;data-panel-tab&#x27;) === name));
      };
      root.querySelectorAll(&#x27;[data-panel-tab]&#x27;).forEach((tab) =&gt; {
        tab.addEventListener(&#x27;click&#x27;, () =&gt; {
          const panelName = tab.getAttribute(&#x27;data-panel-tab&#x27;) || &#x27;graph&#x27;;
          switchPanel(panelName);
          showToast(panelName === &#x27;graph&#x27; ? &#x27;Agent graph shown&#x27; : &#x27;Session context shown&#x27;);
        });
      });

      root.querySelectorAll(&#x27;[data-team]&#x27;).forEach((button) =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          const team = button.getAttribute(&#x27;data-team&#x27;) || &#x27;helpers&#x27;;
          root.querySelectorAll(&#x27;[data-team]&#x27;).forEach((peer) =&gt; peer.classList.remove(&#x27;is-selected&#x27;));
          button.classList.add(&#x27;is-selected&#x27;);
          root.classList.toggle(&#x27;is-solo&#x27;, team === &#x27;solo&#x27;);
          const label = root.querySelector(&#x27;[data-team-label]&#x27;);
          if (label) label.textContent = team === &#x27;solo&#x27; ? &#x27;Solo agent&#x27; : &#x27;Lead + helpers&#x27;;
          if (team === &#x27;solo&#x27;) switchPanel(&#x27;context&#x27;);
          teamPopover?.classList.remove(&#x27;is-open&#x27;);
          showToast(team === &#x27;solo&#x27; ? &#x27;Solo chat selected; no graph will start&#x27; : &#x27;Lead + helpers selected; Sol may build a graph&#x27;);
        });
      });

      root.querySelector(&#x27;[data-usage-toggle]&#x27;)?.addEventListener(&#x27;click&#x27;, () =&gt; {
        const card = root.querySelector(&#x27;.ag-usage-card&#x27;);
        card?.classList.toggle(&#x27;is-collapsed&#x27;);
        showToast(card?.classList.contains(&#x27;is-collapsed&#x27;) ? &#x27;Usage details collapsed&#x27; : &#x27;Usage details expanded&#x27;);
      });

      root.querySelectorAll(&#x27;[data-jump]&#x27;).forEach((button) =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          const target = document.getElementById(button.getAttribute(&#x27;data-jump&#x27;) || &#x27;&#x27;);
          if (!target) return;
          target.scrollIntoView({ behavior: &#x27;smooth&#x27;, block: &#x27;center&#x27; });
          target.classList.remove(&#x27;ag-jump-highlight&#x27;);
          window.requestAnimationFrame(() =&gt; target.classList.add(&#x27;ag-jump-highlight&#x27;));
          window.setTimeout(() =&gt; target.classList.remove(&#x27;ag-jump-highlight&#x27;), 1450);
          showToast(&#x27;Jumped to your earlier message&#x27;);
        });
      });

      const selectNode = (nodeName) =&gt; {
        const node = root.querySelector(`[data-node=&quot;${nodeName}&quot;]`);
        if (!node) return;
        root.querySelectorAll(&#x27;[data-node]&#x27;).forEach((peer) =&gt; peer.classList.remove(&#x27;is-selected&#x27;));
        node.classList.add(&#x27;is-selected&#x27;);
        const title = root.querySelector(&#x27;[data-inspector-title]&#x27;);
        const copy = root.querySelector(&#x27;[data-inspector-copy]&#x27;);
        const files = root.querySelector(&#x27;[data-inspector-files]&#x27;);
        if (title) title.textContent = node.getAttribute(&#x27;data-title&#x27;) || &#x27;&#x27;;
        if (copy) copy.textContent = node.getAttribute(&#x27;data-copy&#x27;) || &#x27;&#x27;;
        if (files) files.textContent = node.getAttribute(&#x27;data-files&#x27;) || &#x27;&#x27;;
        root.classList.remove(&#x27;is-panel-left&#x27;, &#x27;is-panel-bottom&#x27;);
        root.classList.add(&#x27;is-panel-right&#x27;);
        closeDetailPopovers();
        switchPanel(&#x27;graph&#x27;);
        showToast(&#x27;Agent output opened in the right panel&#x27;);
      };
      root.querySelectorAll(&#x27;[data-node]&#x27;).forEach((node) =&gt; node.addEventListener(&#x27;click&#x27;, () =&gt; selectNode(node.getAttribute(&#x27;data-node&#x27;))));
      root.querySelectorAll(&#x27;[data-select-node]&#x27;).forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; selectNode(button.getAttribute(&#x27;data-select-node&#x27;))));

      root.querySelector(&#x27;[data-toggle-pin]&#x27;)?.addEventListener(&#x27;click&#x27;, (event) =&gt; {
        const button = event.currentTarget;
        button.classList.toggle(&#x27;is-selected&#x27;);
        showToast(button.classList.contains(&#x27;is-selected&#x27;) ? &#x27;Agent Desk will stay on top&#x27; : &#x27;Agent Desk will no longer stay on top&#x27;);
      });
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
