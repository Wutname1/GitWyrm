[package]
name = "gitwyrm"
# Placeholder. The release workflow overwrites this from the git tag.
version = "0.0.0"
# Shown to users: this is the description apt and rpm display for the package.
description = "GitWyrm - a targeted Git client"
authors = ["Jeremy"]
edition = "2021"
# The app binary. Without this, the export_bindings bin makes a bare
# `cargo run` (which is what `tauri dev` issues) ambiguous and it refuses
# to start.
default-run = "gitwyrm"
# Raised from 1.77.2 for github-copilot-sdk, which requires 1.94.0. Cargo caps
# dependency resolution at this value, and when it cannot satisfy a crate it
# silently substitutes a stub 0.0.0 placeholder instead of failing, so this must
# stay >= the highest dependency requirement.
rust-version = "1.94.0"

[lib]
name = "gitwyrm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Random install ids for the deployed-build count (see telemetry::install).
# v4 only: the id must carry nothing derived from the machine or the clock.
uuid = { version = "1", features = ["v4"] }
# Already in the tree via Tauri; named directly because the AI agent engine
# drives a child process over pipes and needs these features explicitly.
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt", "macros"] }
log = "0.4"
# The logging backend tauri-plugin-log is built on. Named directly so GitWyrm can
# hand the plugin its own writer (see src/logs.rs) instead of the size-only
# rotation the plugin's file targets come with.
fern = "0.7"
# Dates for the daily log file names, and the local-offset handling that keeps a
# file's name agreeing with the timestamps written inside it.
time = { version = "0.3", features = ["formatting", "local-offset", "macros", "parsing"] }
thiserror = "2"
git2 = "0.21"
notify = "8"
# Deleting a file from the changes menu goes to the Recycle Bin / Trash, not
# straight off disk, so a misclick stays recoverable.
trash = "5"
notify-debouncer-full = "0.7"
# Parses .gitignore chains into a fast, lock-free matcher so the file watcher can
# skip ignored paths without contending with the repo lock that git status holds.
ignore = "0.4"
specta = "=2.0.0-rc.22"
specta-typescript = "0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
# 0.13 moved `form` (and `query`) behind opt-in features, and renamed the TLS
# feature `rustls-tls` -> `rustls`. The device-flow calls in ai/copilot.rs post
# form bodies, so `form` is required.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form"] }
base64 = "0.23"
# Already in the tree via reqwest; named directly so the GitHub CLI fallback can
# synthesize a Response from a body the CLI produced.
http = "1"
# Object-safe async methods on the HostProvider trait, so the code-host
# providers can live behind one `&dyn` list.
async-trait = "0.1"
image = { version = "0.25", default-features = false, features = ["gif", "ico", "jpeg", "png", "webp"] }
sentry = { version = "0.49.1", default-features = false, features = [
  "backtrace",
  "contexts",
  "panic",
  "reqwest",
  "rustls",
  # Structured logs. Without this feature `capture_log` compiles to a no-op and
  # every forwarded log is dropped inside the SDK -- which is exactly what hid
  # the credential tracing added for the Credential Manager investigation.
  "logs",
] }
# Bridges `log::error!`/`warn!` into Sentry events. Without this the backend
# only ever reports panics, so command failures stayed local to gitwyrm.log.
sentry-log = { version = "0.49.1", features = ["logs"] }
# Reopens the folder in the running app when Explorer's "Open with GitWyrm"
# launches a second process, instead of starting a duplicate window.
tauri-plugin-single-instance = "2"
# GitHub's own Copilot SDK. Copilot only returns real model entitlements to
# clients on its approved allowlist, which GitWyrm's OAuth app is not on -- our
# own device-flow token sees zero enabled models. The SDK talks to the Copilot
# CLI, which is approved, so a user's existing seat works.
#
# `bundled-cli` (a default feature) is required, not a convenience: the SDK's
# resolver does no PATH scanning and has no downloader, so without the embedded
# copy it fails with BinaryNotFound unless COPILOT_CLI_PATH is set. The cost is
# real -- it takes the release binary from 20.3 MB to 114.5 MB -- but turning it
# off produces a build that cannot run.
github-copilot-sdk = "1.0.11"
liblzma = { version = "0.4.8", features = ["static"] }
tar = "0.4.46"
sha2 = "0.11.0"

# Explorer's right-click entry is a set of HKCU registry verbs, so the app can
# add and remove it without elevation.
[target.'cfg(windows)'.dependencies]
winreg = "0.56"
# Subclassing the window procedure so the custom title bar can answer
# HTMAXBUTTON and open Snap Layouts. Pinned to the version Tauri already pulls
# in so the build keeps one copy.
windows-sys = { version = "0.61", features = [
	"Win32_Foundation",
	"Win32_UI_WindowsAndMessaging",
	"Win32_UI_Input_KeyboardAndMouse",
	"Win32_System_LibraryLoader",
	"Win32_Graphics_Gdi",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
# Keep debug symbols so Sentry can symbolicate backend panics. `sentry-cli
# debug-files upload` grabs them, then the release workflow strips the shipped
# exe separately -- so users still get a small binary, and Sentry gets readable
# stack traces. (Was `strip = true`; stripping is now a post-build CI step.)
strip = false
debug = "full"
