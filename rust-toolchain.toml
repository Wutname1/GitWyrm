[toolchain]
# github-copilot-sdk requires 1.94.0. Without this pin, an older toolchain
# resolves it to a stub 0.0.0 placeholder and fails at link time with no useful
# error, so pin the floor rather than leaving it to whatever is installed.
channel = "1.97.1"
components = ["rustfmt", "clippy"]
# Targets are per-toolchain: pinning a fresh channel drops any target that was
# added to the old stable by hand. The ARM64 release build needs its target
# declared here or every new machine/CI runner fails at `tauri build` time.
targets = [
	"x86_64-pc-windows-msvc",
	"aarch64-pc-windows-msvc",
	"x86_64-unknown-linux-gnu",
]
